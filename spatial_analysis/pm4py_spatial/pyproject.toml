[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm4py-spatial"
version = "0.1.0"
description = "Spatial-aware pre-processing layer for PM4Py event logs"
requires-python = ">=3.10"
dependencies = [
    "pm4py>=2.7",
    "pandas>=1.5",
]

[project.optional-dependencies]
crs = ["pyproj>=3.4"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
